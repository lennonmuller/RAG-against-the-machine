[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "42 rag-against-machine project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.1",
    "rank-bm25>=0.2.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[tool.mypy]
exclude = [
    "^\\.venv/",
    "^vllm-0.10.1/"
]
